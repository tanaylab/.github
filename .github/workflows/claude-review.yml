# Reusable workflow: reviews a PR with Claude and posts one review.
# Called from each opted-in repo; see README.md.
name: Claude review (reusable)
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tanaylab/.github
          path: reviewer-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r reviewer-src/reviewer/requirements.txt
      - name: Review
        working-directory: reviewer-src
        run: python -m reviewer.review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_DIR: ${{ github.workspace }}/repo
